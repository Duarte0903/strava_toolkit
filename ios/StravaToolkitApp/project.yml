# XcodeGen spec — generates StravaToolkit.xcodeproj reproducibly.
#   brew install xcodegen && cd ios/StravaToolkitApp && xcodegen generate
name: StravaToolkit
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  StravaToolkitKit:
    path: ../StravaToolkitKit
targets:
  StravaToolkit:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: StravaToolkitKit
        product: StravaToolkitKit
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: StravaToolkit
        UIFileSharingEnabled: true              # expose Documents in the Files app
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.stravatoolkit
        GENERATE_INFOPLIST_FILE: "NO"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
